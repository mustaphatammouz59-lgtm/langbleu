let _voices=[];
function loadVoices(){try{_voices=speechSynthesis.getVoices()||[]}catch(e){_voices=[]}}
if("speechSynthesis" in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function pickVoice(code){const loc=langBy(code).tts;let v=_voices.find(v=>v.lang===loc)||_voices.find(v=>v.lang&&v.lang.replace("_","-").startsWith(loc.split("-")[0]));return v||null}
let _sprEl=null,_sprPend=null;
function spriteSpeak(text,code){
  const tab=window["AUD_"+code];
  if(tab){const idx=(PX[code]||[]).indexOf(text);if(idx<0)return false;
    const parts=window["AUDP_"+code];let src="audio-"+code+".mp3",start=tab[idx*2],dur=tab[idx*2+1];
    if(parts){for(const p of parts){if(idx>=p[1]){src=p[0];start=tab[idx*2]-p[2]}}}
    if(!_sprEl){_sprEl=new Audio();_sprEl.preload="none"}
    _sprEl.src=src;_sprEl.currentTime=start;
    const pr=_sprEl.play();if(pr&&pr.catch)pr.catch(()=>speakLive(text,code));
    clearTimeout(_sprEl._t);_sprEl._t=setTimeout(()=>{try{_sprEl.pause()}catch(e){}},dur*1000);
    return true}
  if(window["_AUDL_"+code]){_sprPend={text,code};return "wait"}
  window["_AUDL_"+code]=1;
  const sc=document.createElement("script");sc.src="audio-"+code+".js";
  sc.onload=()=>{_sprPend=null;if(!spriteSpeak(text,code))speakLive(text,code)};
  sc.onerror=()=>{_sprPend=null;speakLive(text,code)};
  setTimeout(()=>{if(_sprPend&&_sprPend.text===text){_sprPend=null;speakLive(text,code)}},4000);
  document.head.appendChild(sc);_sprPend={text,code};return "wait"}
function speakLive(text,code){
  const done=()=>toast(t("audio_err"));
  if("speechSynthesis" in window){
    const trySpeak=()=>{const u=new SpeechSynthesisUtterance(text);const v=pickVoice(code);if(v){u.voice=v;u.lang=v.lang}else{u.lang=langBy(code).tts}
      u.onerror=()=>googleSpeak(text,code,done);speechSynthesis.cancel();speechSynthesis.speak(u)};
    if(!_voices.length){loadVoices();if(!_voices.length){setTimeout(trySpeak,350);setTimeout(()=>{},0);}else trySpeak()}else trySpeak();
  } else googleSpeak(text,code,done)}
function googleSpeak(text,code,fail){
  const tl=GTTS[code]||code;const a=new Audio("https://translate.googleapis.com/translate_tts?ie=UTF-8&client=tw-ob&tl="+encodeURIComponent(tl)+"&q="+encodeURIComponent(text.slice(0,200)));
  const pr=a.play();let failed=false;const bad=()=>{if(!failed){failed=true;fail&&fail()}};
  a.addEventListener("error",bad);if(pr&&pr.catch)pr.catch(bad)}
function speak(text,code){const r=spriteSpeak(text,code);if(r===true||r==="wait")return;speakLive(text,code)}

function pageTTT(){
  const pool=gamePool(24);let qi=0,board=Array(9).fill(""),over=false;
  app.innerHTML=gameHead(t("act_ttt"),t("help_ttt"))+'<div class="play-box"><div class="player-tgt" id="ttQ" style="font-size:22px;font-weight:800;color:var(--purple)"></div><div class="opt-grid" id="ttOpts"></div><div class="ttt-grid" id="ttBoard"></div><div class="feedback" id="ttFb"></div><button class="chip-btn" onclick="location.hash=\'#/game/ttt\';render()">↻ '+esc(t("new_phrase"))+'</button></div>';
  bindPairBar(app);
  const lines=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
  function win(p){return lines.some(l=>l.every(i=>board[i]===p))}
  function paintBoard(){document.getElementById("ttBoard").innerHTML=board.map((c,i)=>'<button class="ttt-cell" data-i="'+i+'">'+c+"</button>").join("");
    app.querySelectorAll(".ttt-cell").forEach(b=>b.onclick=()=>place(+b.dataset.i))}
  function ask(){const p=pool[qi%pool.length];qi++;const all=lessonPhrases(DB.get("lastLesson",0));const wrong=shuffle(all.filter(x=>x.id!==p.id)).slice(0,2);
    const opts=shuffle([{v:p.nat,label:p.nat}].concat(wrong.map(w=>({v:w.nat,label:w.nat}))));
    document.getElementById("ttQ").textContent=p.tgt;
    document.getElementById("ttOpts").innerHTML=opts.map(o=>'<button class="opt-btn" data-v="'+esc(o.v)+'">'+esc(o.label)+"</button>").join("");
    app.querySelectorAll("#ttOpts .opt-btn").forEach(b=>b.onclick=()=>{window._ttAnswer=b.dataset.v===p.nat;app.querySelectorAll("#ttOpts .opt-btn").forEach(x=>x.style.borderColor=x===b?"var(--purple)":"")})}
  function place(i){ if(over||board[i])return; if(window._ttAnswer==null){document.getElementById("ttFb").textContent=t("help_quiz");return}
    if(window._ttAnswer){board[i]="X";document.getElementById("ttFb").innerHTML='<span class="ok">'+esc(t("ttt_correct"))+"</span>"}
    else{board[i]="O";document.getElementById("ttFb").innerHTML='<span class="bad">'+esc(t("ttt_wrong"))+"</span>"}
    window._ttAnswer=null;
    if(win("X")){over=true;document.getElementById("ttFb").innerHTML='<span class="ok">'+esc(t("ttt_win"))+"</span>";saveScore("ttt",1,1);paintBoard();return}
    if(win("O")){over=true;document.getElementById("ttFb").innerHTML='<span class="bad">'+esc(t("ttt_lose"))+"</span>";paintBoard();return}
    if(board.every(c=>c)){over=true;document.getElementById("ttFb").textContent=t("ttt_draw");paintBoard();return}
    if(board[i]==="X"){const empty=board.map((c,j)=>c?"":j).filter(x=>x!=="");if(empty.length){board[empty[Math.floor(Math.random()*empty.length)]]="O"}
      if(win("O")){over=true;document.getElementById("ttFb").innerHTML='<span class="bad">'+esc(t("ttt_lose"))+"</span>"}
      if(board.every(c=>c)&&!over){over=true;document.getElementById("ttFb").textContent=t("ttt_draw")}}
    paintBoard();ask()}
  paintBoard();ask();
}

let mediaRec=null,recChunks=[],lastBlob=null;
function pagePron(){
  const pool=lessonPhrases(DB.get("lastLesson",0));let idx=0;
  let h='<h1 class="page-h1">'+esc(t("pron_title"))+'</h1><p class="sub">'+esc(t("pron_intro"))+"</p>"+pairBarHTML();
  h+='<div class="play-box"><div style="color:var(--muted)">'+esc(t("pron_target"))+'</div><div class="player-tgt" id="prTgt" style="font-size:28px;font-weight:800;color:var(--purple);margin:8px 0"></div><div class="player-ctrl"><button class="chip-btn" id="prPrev">←</button><button class="p-btn" id="prListen" title="'+esc(t("listen"))+'">▶</button><button class="rec-btn" id="prRec" title="'+esc(t("pron_record"))+'">🎙️</button><button class="chip-btn" id="prNext">→</button></div><div id="prOut" style="margin-top:12px"></div><div class="feedback" id="prFb"></div></div>';
  app.innerHTML=h;bindPairBar(app);
  function paint(){document.getElementById("prTgt").textContent=pool[idx].tgt;document.getElementById("prOut").innerHTML="";document.getElementById("prFb").textContent=""}
  document.getElementById("prPrev").onclick=()=>{idx=(idx-1+pool.length)%pool.length;paint()};
  document.getElementById("prNext").onclick=()=>{idx=(idx+1)%pool.length;paint()};
  document.getElementById("prListen").onclick=()=>speak(pool[idx].tgt,settings.target);
  const recBtn=document.getElementById("prRec");
  recBtn.onclick=async()=>{ const p=pool[idx];
    if(mediaRec&&mediaRec.state==="recording"){mediaRec.stop();recBtn.textContent="🎙️";return}
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
    if(SR){ try{ const rec=new SR(); rec.lang=langBy(settings.target).tts; rec.interimResults=false;
        rec.onresult=e=>{ const heard=e.results[0][0].transcript; const norm=s=>s.toLowerCase().replace(/[^\p{L}\p{N} ]/gu,"").replace(/\s+/g," ").trim();
          const a=norm(heard),b=norm(p.tgt); const sc=a===b?100:Math.max(10,100-Math.round(Math.abs(a.length-b.length)*6)-(a.split(" ").filter(w=>!b.split(" ").includes(w)).length*12));
          document.getElementById("prOut").innerHTML='<div>'+esc(t("pron_heard"))+" <strong>"+esc(heard)+'</strong></div><div class="score-big">'+esc(t("pron_score"))+" "+Math.min(100,sc)+"%</div>"+(sc<80?'<div class="sub">'+esc(t("pron_tip"))+"</div>":"")};
        rec.onerror=()=>startRecorder(); rec.start(); document.getElementById("prFb").textContent="🎙️ …"; return }catch(e){} }
    startRecorder();
    function startRecorder(){ if(!navigator.mediaDevices||!window.MediaRecorder){document.getElementById("prFb").innerHTML='<span class="bad">'+esc(t("pron_mic_err"))+"</span>";return}
      navigator.mediaDevices.getUserMedia({audio:true}).then(stream=>{ recChunks=[];mediaRec=new MediaRecorder(stream);
        mediaRec.ondataavailable=e=>recChunks.push(e.data);
        mediaRec.onstop=()=>{ lastBlob=new Blob(recChunks,{type:"audio/webm"}); const url=URL.createObjectURL(lastBlob);
          document.getElementById("prOut").innerHTML='<div>'+esc(t("pron_your_rec"))+'</div><audio controls src="'+url+'" style="margin-top:8px"></audio><div class="sub" style="margin-top:8px">'+esc(t("pron_saved_note"))+"</div>";
          stream.getTracks().forEach(tr=>tr.stop()) };
        mediaRec.start(); recBtn.textContent="⏹"; document.getElementById("prFb").textContent="🎙️ …";
      }).catch(()=>{document.getElementById("prFb").innerHTML='<span class="bad">'+esc(t("pron_mic_err"))+"</span>"}) } };
  paint();
}

  app.querySelectorAll("[data-speak]").forEach(b=>b.onclick=()=>{const p=phraseAt(+b.dataset.speak);speak(p.tgt,settings.target)});
  const btn=document.getElementById("accBtn");
  if(btn)btn.onclick=()=>{const name=document.getElementById("accName").value.trim(),email=document.getElementById("accEmail").value.trim(),pass=document.getElementById("accPass").value;
    if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)||pass.length<6){document.getElementById("accFb").innerHTML='<span class="bad">'+esc(t("form_error"))+"</span>";return}
    progress.user={name,email};saveProgress();applyChrome();render()};
  const so=document.getElementById("signOut");if(so)so.onclick=()=>{progress.user=null;saveProgress();applyChrome();render()};
  const del=document.getElementById("delAcc");if(del)del.onclick=()=>{progress={done:{},favs:[],scores:[],user:null};saveProgress();applyChrome();render()};
}
/* ===== Static pages (original English bodies; titles localized) ===== */
const STATIC={
about:{k:"about_t",body:'<p>LangBleu is a free language-learning platform built for one simple idea: anyone, anywhere, can start speaking a new language today — without paying, without an account, and without installing anything.</p><h2>What you get</h2><ul><li>125 lessons and 1,025 real everyday phrases</li><li>50 languages, every one with the complete course</li><li>Listening practice and pronunciation training on every phrase</li><li>8 vocabulary games that use your current lesson</li><li>Progress, favorites and achievements saved on your device</li></ul><h2>How it works</h2><p>Pick the language you speak and the language you want to learn. Work through the lessons in order, listen to every phrase, say it out loud, and mark it done. A few minutes a day is enough to build real vocabulary that sticks.</p><h2>Our content</h2><p>Every lesson on LangBleu is written and translated for LangBleu. The course teaches everyday words and phrases — greetings, family, food, travel, work and more — the vocabulary you actually need first.</p>'},
faq:{k:"faq_t",body:'<h2>Is LangBleu really free?</h2><p>Yes. Every lesson, game and feature is free, and there is no account required to learn.</p><h2>How many languages can I learn?</h2><p>50 languages, and every language carries the complete course of 125 lessons and 1,025 phrases. You can also use any of the 50 as your "I speak" language — the whole interface follows your choice.</p><h2>How does the audio work?</h2><p>Tap the play button on any phrase to hear it. LangBleu uses high-quality recorded voices; while a language\'s recordings are being prepared, your device\'s built-in voice reads the phrase instead.</p><h2>Do I need an account?</h2><p>No. An optional on-device account simply attaches your name to your progress. Your progress, favorites and scores are stored in your browser on your device.</p><h2>Can teachers use LangBleu?</h2><p>Yes — LangBleu is a handy free classroom companion for vocabulary practice and listening exercises.</p>'},
privacy:{k:"privacy_t",body:'<p>LangBleu is designed to respect your privacy.</p><h2>What we store</h2><p>Your settings, progress, favorites, game scores and optional on-device account name are stored only in your own browser (local storage). They never leave your device and are not sent to any server.</p><h2>Audio</h2><p>Phrase audio is played from files or from your device\'s text-to-speech engine. If you use the pronunciation recorder, your recording stays in the page on your device — it is not uploaded.</p><h2>Advertising</h2><p>LangBleu is supported by advertising. Ad partners may use cookies to serve ads, as described in their own policies. You can control cookies in your browser settings.</p><h2>Contact</h2><p>For any privacy question, use the contact page.</p>'},
terms:{k:"terms_t",body:'<p>By using LangBleu you agree to these simple terms.</p><h2>The service</h2><p>LangBleu provides free language-learning content for personal, educational use. The service is provided "as is" without warranties of any kind.</p><h2>Content</h2><p>All lessons and texts on LangBleu are original to LangBleu and protected by copyright. You may use them for your own learning; please do not republish them as your own.</p><h2>Accounts</h2><p>Accounts are stored locally on your device in this version. You are responsible for activity on your device.</p><h2>Changes</h2><p>We may update these terms from time to time; the current version always applies.</p>'}};
function pageStatic(name){const s=STATIC[name];app.innerHTML='<h1 class="page-h1">'+esc(t(s.k))+'</h1><div class="static-body">'+s.body+"</div>"+adSlot()}
function pageContact(){
  let h='<h1 class="page-h1">'+esc(t("contact_t"))+'</h1><p class="sub">'+esc(t("contact_text"))+'</p><div class="form-box"><label>'+esc(t("your_name"))+'</label><input id="cName" type="text"><label>'+esc(t("your_email"))+'</label><input id="cEmail" type="email"><label>'+esc(t("subject"))+'</label><input id="cSubj" type="text"><label>'+esc(t("message"))+'</label><textarea id="cMsg" rows="5"></textarea><button class="primary-btn" id="cSend">'+esc(t("send"))+'</button><div class="feedback" id="cFb"></div></div>';
  app.innerHTML=h;
  document.getElementById("cSend").onclick=()=>{const n=document.getElementById("cName").value.trim(),e=document.getElementById("cEmail").value.trim(),s=document.getElementById("cSubj").value.trim(),m=document.getElementById("cMsg").value.trim();
    if(!n||!e||!m){document.getElementById("cFb").innerHTML='<span class="bad">'+esc(t("fill_all"))+"</span>";return}
    location.href="mailto:contact@langbleu.com?subject="+encodeURIComponent(s||"LangBleu contact")+"&body="+encodeURIComponent(m+"\n\n— "+n+" ("+e+")")};
}
/* ===== Router ===== */
function render(){
  closePicker();applyChrome();stopPlayer();
  const hash=location.hash.replace(/^#\/?/,"");const parts=hash.split("/");const page=parts[0]||"";
  window.scrollTo(0,0);
  if(page==="")pageHome();
  else if(page==="languages")pageLanguages();
  else if(page==="lessons")pageLessons();
  else if(page==="lesson")pageLesson(parts[1]);
  else if(page==="games")pageGames();
  else if(page==="game"){const g=parts[1];if(g==="flashcards")pageFlashcards();else if(g==="matching")pageMatching();else if(g==="memory")pageMemory();else if(g==="ttt")pageTTT();else if(g==="listening")pageListening();else if(g==="quiz")pageQuiz();else if(g==="writing")pageWriting();else if(g==="letters")pageLetters();else pageGames()}
  else if(page==="pronunciation")pagePron();
  else if(page==="progress")pageProgress();
  else if(page==="about")pageStatic("about");
  else if(page==="faq")pageStatic("faq");
  else if(page==="privacy")pageStatic("privacy");
  else if(page==="terms")pageStatic("terms");
  else if(page==="contact")pageContact();
  else pageHome();
}
window.addEventListener("hashchange",render);
render();
</script>

</html>
